# SPDX-License-Identifier: Apache-2.0
#
# trust-plane CI. Mirrors the verification checklist in CONTRIBUTING.md (4.3):
#   1. nixfmt + flake evaluation, 2. build the tools package,
#   3. build the Tier 1 host closures, 4. run the NixOS VM tests on KVM.
#
# The jobs run sequentially: they share one GitHub Actions cache key
# (magic-nix-cache), and parallel writers/readers of the same key hit the
# cache API rate limit (throttled substituter, corrupted store paths).
#
# Nix is installed by DeterminateSystems/nix-installer-action (which also
# configures KVM on the runner for the VM tests); DeterminateSystems/magic-nix-cache-action
# shares store paths between runs via the GitHub Actions cache.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nix-checks:
    name: Lint, evaluate, package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: nixfmt
        run: nix fmt -- --check $(git ls-files '*.nix')
      - name: Flake check (evaluate all outputs)
        run: nix flake check --no-build
      - name: Build trust-tpm-tools
        run: nix build .#trust-tpm-tools
      - name: shellcheck the TPM tools
        # The tools are writeShellApplication scripts (only common.sh is a
        # source file), so check the built package with the devShell's pinned
        # shellcheck; SC2034/SC2329 are the exclusions the derivation declares.
        run: |
          out=$(nix eval .#trust-tpm-tools --raw)
          nix develop .#devShells.x86_64-linux.default --command shellcheck --exclude=SC2034,SC2329 "$out"/bin/*
      - name: Evaluate the colmena hive
        run: nix eval .#colmenaHive.deploymentConfig --json > /dev/null

  host-closures:
    name: Host closures (Tier 1 nodes)
    needs: nix-checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          kvm: false
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Build each node's toplevel (includes the lanzaboote boot closure)
        run: |
          for node in trust-node-01 trust-node-02 trust-node-03; do
            nix build ".#nixosConfigurations.${node}.config.system.build.toplevel"
          done

  vm-tests:
    name: NixOS VM tests
    needs: host-closures
    runs-on: ubuntu-latest
    # Retries make this worst-case long: a stalled check burns the driver's
    # 3600 s global timeout before it can be retried.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        with:
          kvm: true
      - uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Require KVM
        run: |
          if [ "${DETERMINATE_NIX_KVM:-0}" != "1" ]; then
            echo "::error::KVM is not available on this runner; the NixOS VM tests require it"
            exit 1
          fi
      # The tests run one at a time: the hosted runner is 4 vCPU / 16 GiB,
      # and the three tests together start nine QEMU VMs (~11 GiB of guest
      # RAM), which thrashes the runner into the 3600 s driver timeout.
      # Building a check runs its test driver; a failing test fails the build.
      #
      # The nixpkgs test driver talks to the VMs over a virtio console
      # ("backdoor"); on the hosted nested-KVM runner that channel can
      # transiently stall under load (the guest clock drops well below
      # wall-clock), making a completed command's response never arrive and
      # the driver sit out the full 3600 s global timeout. Each check is
      # therefore retried once: a failed build is re-run, which re-runs the
      # test driver from a clean slate.
      - name: Build and run the VM tests (retry once on transient stall)
        run: |
          for check in tpm-seal admin-access bao-cluster; do
            drv=".#checks.x86_64-linux.${check}"
            ok=0
            for attempt in 1 2; do
              if nix build "${drv}"; then
                ok=1
                break
              fi
              echo "::warning::${check} failed on attempt ${attempt}; retrying"
            done
            if [ "${ok}" -ne 1 ]; then
              echo "::error::${check} failed after 2 attempts"
              exit 1
            fi
          done
